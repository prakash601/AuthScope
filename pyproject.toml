[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "authscope"
version = "0.1.0"
description = "Login Intelligence & Anti-Bot Detection Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "playwright>=1.48",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "structlog>=24.4",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "jsonschema>=4.23",
    "types-pyyaml",
    "types-boto3",
]

[tool.setuptools.packages.find]
include = ["api*", "engine*", "pipeline*", "workers*", "db*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated files: long sa.Column lines are standard.
"db/migrations/versions/*" = ["E501", "W291"]
# Embedded JS blobs and UA datasets can't be meaningfully wrapped.
"engine/fingerprints.py" = ["E501"]
"engine/page/static_analyzer.py" = ["E501"]
"tests/fixtures_site.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"

[tool.coverage.run]
source = ["engine", "pipeline", "api", "workers", "db", "config", "telemetry"]

[tool.coverage.report]
fail_under = 70
