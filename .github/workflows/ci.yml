name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: authscope
          POSTGRES_PASSWORD: authscope-dev
          POSTGRES_DB: authscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authscope"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: authscope
      POSTGRES_PASSWORD: authscope-dev
      POSTGRES_DB: authscope
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: authscope-dev
      S3_SECRET_KEY: authscope-dev-secret
      S3_BUCKET: authscope-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - name: start MinIO
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=authscope-dev \
            -e MINIO_ROOT_PASSWORD=authscope-dev-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live
      - name: create MinIO bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local="http://authscope-dev:authscope-dev-secret@localhost:9000" \
            minio/mc:latest mc mb --ignore-existing local/authscope-artifacts
          docker run --rm --network host \
            -e MC_HOST_local="http://authscope-dev:authscope-dev-secret@localhost:9000" \
            minio/mc:latest mc stat local/authscope-artifacts
      - name: lint
        run: ruff check api engine pipeline workers db telemetry.py tests
      - name: typecheck
        run: mypy config.py api engine pipeline workers db telemetry.py
      - name: migrations
        run: alembic upgrade head
      - name: load signatures
        run: python -m db.load_signatures
      - name: tests with coverage
        run: >
          pytest tests/
          --cov=engine --cov=pipeline --cov=api --cov=workers --cov=db --cov=config
          --cov-report=term-missing --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traces
          path: /tmp/authscope_traces/
          if-no-files-found: ignore
