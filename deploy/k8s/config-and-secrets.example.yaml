# Template only — create real secrets with `kubectl create secret` or your
# secret manager's CI integration. NEVER commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: authscope-secrets
type: Opaque
stringData:
  POSTGRES_USER: "replace-me"
  POSTGRES_PASSWORD: "replace-me"
  POSTGRES_DB: "authscope"
  S3_ACCESS_KEY: "replace-me"
  S3_SECRET_KEY: "replace-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authscope-config
data:
  POSTGRES_HOST: "postgres.authscope.svc"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://redis.authscope.svc:6379/0"
  S3_ENDPOINT_URL: "http://minio.authscope.svc:9000"
  S3_BUCKET: "authscope-artifacts"
  SCAN_TIMEOUT_SECONDS: "45"
  SCAN_RESULT_CACHE_TTL_HOURS: "6"
  SECURITY_DISABLE_SSRF_GUARD: "false"
  EVIDENCE_RETENTION_DAYS: "30"
