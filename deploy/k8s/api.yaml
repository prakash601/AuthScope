apiVersion: apps/v1
kind: Deployment
metadata:
  name: authscope-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: authscope, tier: api }
  template:
    metadata:
      labels: { app: authscope, tier: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: registry.example.com/authscope/api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: authscope-config }
            - secretRef: { name: authscope-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: authscope-api
spec:
  selector: { app: authscope, tier: api }
  ports:
    - port: 80
      targetPort: 8000
