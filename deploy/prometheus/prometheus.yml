# Prometheus scrape config for local AuthScope observability.
# The API runs on the host (`make run-api`); Docker Desktop resolves the host
# via host.docker.internal. On Linux, run with --add-host or point at the API
# service name if containerized.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: authscope-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
